plugins {
    id 'idea'
    id "maven-publish"
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

repositories {
    // Local libs dir - JEI impl jar (compile-only, not shipped)
    flatDir { dirs 'libs' }
    mavenLocal()   // gtceu fork published via: cd gtceu_8.0.0 && ./gradlew publishToMavenLocal
    mavenCentral()

    // GTCeu maven (fallback if mavenLocal is missing)
    maven { url = 'https://maven.gtceu.com'; content { includeGroup 'com.gregtechceu.gtceu' } }

    // JEI API jars (thin, always reachable - compile-only)
    maven { url = "https://maven.blamejared.com/"; content { includeGroupByRegex "mezz\\.jei.*" } }

    // EMI
    maven { url = "https://maven.terraformersmc.com/releases/"; content { includeGroup "dev.emi" } }

    // CurseMaven (Jade)
    maven { url "https://cursemaven.com/"; content { includeGroup "curse.maven" } }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    // ── GregTech (local fork, published to mavenLocal) ────────────────────────
    // fg.deobf() remaps SRG->MCP so we can call GT classes by deobf name.
    // To update: cd gtceu_8.0.0 && ./gradlew publishToMavenLocal
    implementation fg.deobf("com.gregtechceu.gtceu:gtceu-1.20.1:${gtceu_version}")

    // ── JEI (strictly optional) ───────────────────────────────────────────────
    // API-only jars from blamejared: lets us write JEI compat without requiring it.
    // No runtimeOnly — JEI is never a hard dependency; players use EMI or nothing.
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    // Local full jar satisfies fg.deobf remapping; not on runtime classpath.
    compileOnly(files("libs/jei-${minecraft_version}-forge-${jei_version}.jar"))

    // ── EMI (preferred recipe viewer — dev runs only) ─────────────────────────
    runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}+${minecraft_version}")

    // ── Compile deps — local jars copied from modpack (exact version match) ───
    compileOnly(files(
        "libs/kubejs-forge-${kubejs_version}.jar",
        "libs/rhino-forge-${rhino_version}.jar",
        "libs/cloth-config-${cloth_config_version}-forge.jar",
        "libs/architectury-${architectury_version}-forge.jar",
        "libs/ad_astra-forge-${minecraft_version}-${ad_astra_version}.jar",
        // Registrate is jarJar embedded inside gtceu - extract it explicitly for javac
        "libs/Registrate-MC1.20-${registrate_version}.jar"
    ))

    // ── Runtime-only transitive deps — local jars from modpack ───────────────
    runtimeOnly(files(
        "libs/botarium-forge-${minecraft_version}-${botarium_version}.jar",
        "libs/resourcefullib-forge-${minecraft_version}-${resourcefullib_version}.jar",
        "libs/resourcefulconfig-forge-${minecraft_version}-${resourcefulconfig_version}.jar",
        "libs/citadel-${citadel_version}-${minecraft_version}.jar",
        "libs/configuration-forge-${minecraft_version}-${configuration_version}.jar"
    ))

    // Jade — runtime only (we don't call its API)
    runtimeOnly fg.deobf("curse.maven:jade-324717:5390389")
}

tasks.named('processResources', ProcessResources).configure {
    var properties = ["mod_license"      : mod_license,
                      "mod_id"           : mod_id,
                      "version"          : mod_version,
                      "mod_name"         : mod_name,
                      "mod_url"          : mod_url,
                      "mod_author"       : mod_author,
                      "forge_version"    : forge_version.split("\\.")[0],
                      "minecraft_version": minecraft_version,
                      "gtceu_version"    : gtceu_version,
                      "jei_version"      : jei_version,]
    inputs.properties(properties)
    filesMatching("META-INF/mods.toml") { expand properties + [project: project] }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
}

